<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO Meta Tags -->
    <title>ShopZone - Curated Essentials for Modern Living</title>
    <meta name="title" content="ShopZone - Curated Essentials for Modern Living" />
    <meta name="description" content="Discover ShopZone, the premier online destination for carefully curated modern living essentials, minimalist electronics, refined apparel, and home aesthetics with free worldwide shipping." />

    <meta name="author" content="Fazla (devFazla)" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#5811E0" />
    <link rel="canonical" href="https://shopzone.devfazla.com/" />

    <!-- Icons and Favicons -->

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shopzone.devfazla.com/" />
    <meta property="og:site_name" content="ShopZone" />
    <meta property="og:title" content="ShopZone - Curated Essentials for Modern Living" />
    <meta property="og:description" content="Discover ShopZone, the premier online destination for carefully curated modern living essentials, minimalist electronics, refined apparel, and home aesthetics." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://shopzone.devfazla.com/" />
    <meta name="twitter:title" content="ShopZone - Curated Essentials for Modern Living" />

    <meta name="twitter:image:alt" content="ShopZone Logo" />
    <meta name="twitter:creator" content="@devfazla" />

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "ShopZone",
        "url": "https://shopzone.devfazla.com/",
        "logo": "https://shopzone.devfazla.com/logo.png",
        "image": "https://shopzone.devfazla.com/logo.png",
        "description": "An interactive, fully responsive, and modern e-commerce storefront with a sleek UI, dynamic category filtering, cart management, and curated essentials.",
        "founder": {
          "@type": "Person",
          "name": "Fazla",
          "url": "https://devfazla.com"
        },
        "sameAs": [
          "https://devfazla.com"
        ],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://shopzone.devfazla.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script>
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Fallback if property definition is restricted
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
